name: ci

on:
  push:
  pull_request:

jobs:
  example-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the example eval against its gates
        run: python eval/run_eval.py --gold example/gold.jsonl --system example/system.py --gates example/gates.yaml
      - name: Run the checks
        run: python tests/check_example.py
